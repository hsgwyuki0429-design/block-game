# SLIDE POP! の世界共通ランキング。中身は worker/ にある。
#
#   npm run rank:deploy   # 手元から上げる（初回だけ npm run rank:login）
#
# **このファイルはリポジトリのルートに置くこと。** Cloudflare の Git 連携
# （Workers Builds）は Root directory の直下で `npx wrangler deploy` を走らせるので、
# worker/ の中に置くと設定が見つからず Deploy だけが失敗する。
#
# name は URL になる（https://<name>.<アカウントのサブドメイン>.workers.dev/）。
# ここを変えると src/config.js の RANKING_ENDPOINT も直す必要がある ―― 揃えておくこと。
name = "slidepop"
main = "worker/worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

# ダッシュボードにログとエラーを残す。
# 「保存されない」ときに、届いていないのか弾いているのかをここで見分ける。
[observability]
enabled = true

# レベルごとに 1 つの器。作成コマンドも ID の貼り付けも要らず、
# 下の migrations が deploy のときに勝手に用意する。
[[durable_objects.bindings]]
name = "RANK"
class_name = "RankStore"

# new_sqlite_classes = SQLite で保存する Durable Object。
# 一度 deploy したらこの tag と行は消さないこと（消すと中の記録ごと作り直しになる）。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RankStore"]
